name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Run against each installed wheel: the extension must be the build for
  # this exact interpreter, must leave a free-threaded interpreter's GIL
  # off, and must back rampa's trend sink.
  WHEEL_SMOKE: |
    import importlib.util, pathlib, sys, sysconfig
    from importlib.machinery import EXTENSION_SUFFIXES

    free_threaded = bool(sysconfig.get_config_var("Py_GIL_DISABLED"))
    package = pathlib.Path(sysconfig.get_path("platlib"), "rampa")
    (path,) = [p for p in package.glob("_core.*") if p.suffix in {".so", ".pyd"}]
    assert path.name.endswith(EXTENSION_SUFFIXES[0]), (path.name, EXTENSION_SUFFIXES[0])
    spec = importlib.util.spec_from_file_location("rampa._core", path)
    core = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(core)
    sys.modules["rampa._core"] = core
    if free_threaded:
        assert not sys._is_gil_enabled(), "rampa._core turned the GIL back on"

    from rampa.metrics import HdrTrendSink

    sink = HdrTrendSink()
    sink.add(12.5)
    assert sink.format(1.0)["count"] == 1.0
    print(sys.version.split()[0], "free-threaded" if free_threaded else "GIL", path.name)

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: .tool-versions
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check --output-format github
      - name: Tests (pytest)
        run: uv run pytest

  changes:
    # Wheels only change with the Rust code, packaging metadata, or this
    # workflow; tags and manual runs build them regardless.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packaging:
              - 'rust/**'
              - pyproject.toml
              - uv.lock
              - .github/workflows/tests.yml

  wheels:
    name: wheels (${{ matrix.platform.name }})
    needs: changes
    if: >-
      !cancelled() && !failure()
      && (needs.changes.outputs.packaging == 'true'
          || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - name: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: musllinux_1_2
            musl: true
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            musl: true
          - name: macos-arm64
            runner: macos-15
            target: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x64
            runner: windows-2025
            target: x86_64
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: .tool-versions
      - name: Choose the build interpreters
        id: interpreters
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            # maturin-action builds inside the manylinux/musllinux image,
            # which carries its own interpreters.
            echo "list=python3.14 python3.15 python3.14t python3.15t" >> "$GITHUB_OUTPUT"
          else
            # Name each interpreter by path: a bare 3.14 can resolve to a
            # free-threaded build that comes first on PATH.
            uv python install 3.14 3.15 3.14t 3.15t
            list=$(for v in 3.14+gil 3.15+gil 3.14t 3.15t; do
              path=$(uv python find --managed-python "$v")
              # Forward slashes: the action splits its args like a shell.
              [ "$RUNNER_OS" = Windows ] && path=$(cygpath -m "$path")
              printf '%s ' "$path"
            done)
            echo "list=$list" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          rust-toolchain: stable
          args: >-
            --release
            --locked
            --out dist
            --compatibility pypi
            -i ${{ steps.interpreters.outputs.list }}
      - name: Smoke-test each wheel
        if: ${{ !matrix.platform.musl }}
        run: |
          set -euo pipefail
          ls -1 dist
          # `+gil` only matches installed interpreters; install them first.
          uv python install 3.14 3.15 3.14t 3.15t
          export VIRTUAL_ENV="$RUNNER_TEMP/smoke"
          bin="$VIRTUAL_ENV/bin"
          [ "$RUNNER_OS" = Windows ] && bin="$VIRTUAL_ENV/Scripts"
          for python in 3.14+gil 3.15+gil 3.14t 3.15t; do
            uv venv --clear --python "$python" "$VIRTUAL_ENV"
            uv pip install --no-index --no-deps --no-build --find-links dist rampa
            uv pip install --find-links dist rampa
            "$bin/python" -c "$WHEEL_SMOKE"
            "$bin/rampa" --version
          done
      - name: Smoke-test each wheel (Alpine)
        if: ${{ matrix.platform.musl }}
        run: |
          ls -1 dist
          docker run --rm -e WHEEL_SMOKE -v "$PWD/dist:/dist:ro" \
            ghcr.io/astral-sh/uv:0.13.4-alpine sh -euc '
              uv python install 3.14 3.15 3.14t 3.15t
              export VIRTUAL_ENV=/tmp/smoke
              for python in 3.14+gil 3.15+gil 3.14t 3.15t; do
                uv venv --clear --python "$python" "$VIRTUAL_ENV"
                uv pip install --no-index --no-deps --no-build --find-links /dist rampa
                uv pip install --find-links /dist rampa
                "$VIRTUAL_ENV/bin/python" -c "$WHEEL_SMOKE"
                "$VIRTUAL_ENV/bin/rampa" --version
              done'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: changes
    if: >-
      !cancelled() && !failure()
      && (needs.changes.outputs.packaging == 'true'
          || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: .tool-versions
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build from the sdist and smoke-test it
        run: |
          set -euo pipefail
          uv python install 3.15
          export VIRTUAL_ENV="$RUNNER_TEMP/sdist"
          uv venv --python 3.15+gil "$VIRTUAL_ENV"
          uv pip install dist/*.tar.gz
          "$VIRTUAL_ENV/bin/python" -c "$WHEEL_SMOKE"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  dist:
    # What the release job would upload: every wheel plus the sdist, with
    # metadata PyPI accepts. Runs whenever the wheels do, so a tag never
    # discovers a missing platform.
    needs: [wheels, sdist]
    if: ${{ !cancelled() && !failure() && needs.wheels.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: .tool-versions
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Check the distributions
        run: |
          set -euo pipefail
          ls -1 dist
          uvx twine check --strict dist/*
          uv run --no-project --with packaging python - <<'EOF'
          import pathlib, re
          from packaging.utils import parse_sdist_filename, parse_wheel_filename

          files = sorted(pathlib.Path("dist").iterdir())
          sdists = [f for f in files if f.name.endswith(".tar.gz")]
          wheels = [f for f in files if f.suffix == ".whl"]
          assert len(sdists) == 1, sdists
          parse_sdist_filename(sdists[0].name)
          # macOS tags carry a deployment target; compare the architecture.
          found = {
              (tag.interpreter, tag.abi, re.sub(r"^macosx_\d+_\d+_", "macosx_", tag.platform))
              for wheel in wheels
              for tag in parse_wheel_filename(wheel.name)[3]
          }
          platforms = {
              "manylinux_2_28_x86_64", "manylinux_2_28_aarch64",
              "musllinux_1_2_x86_64", "musllinux_1_2_aarch64",
              "macosx_arm64", "macosx_x86_64", "win_amd64", "win_arm64",
          }
          abis = {("cp314", "cp314"), ("cp315", "cp315"), ("cp314", "cp314t"), ("cp315", "cp315t")}
          expected = {(i, a, p) for i, a in abis for p in platforms}
          assert found == expected, (sorted(expected - found), sorted(found - expected))
          assert len(wheels) == len(expected), len(wheels)
          print(f"{len(wheels)} wheels and 1 sdist ready to publish")
          EOF

  release:
    runs-on: ubuntu-latest
    needs: [test, dist]
    # Spell out the status check: an implicit success() also covers
    # `changes`, which every tag push skips.
    if: >-
      !cancelled()
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      && needs.test.result == 'success' && needs.dist.result == 'success'
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
