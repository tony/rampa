[project]
name = "rampa"
version = "0.0.1a1"
description = "Load testing framework"
requires-python = ">=3.14,<4.0"
authors = [
  {name = "Tony Narlock", email = "tony@git-pull.com"}
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
  "Typing :: Typed",
]

keywords = ["load-test", "benchmark", "http", "testing"]
readme = "README.md"
packages = [
  { include = "*", from = "src" },
]
include = [
  { path = "tests", format = "sdist" },
  { path = "docs", format = "sdist" },
  { path = "conftest.py", format = "sdist" },
]

dependencies = [
  "pydantic>=2.0",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
mcp = ["fastmcp>=4.0,<5.0"]
tui = ["textual>=3.0"]
grpc = ["grpcio>=1.70"]

[project.scripts]
rampa = "rampa.cli:main"
rampa-mcp = "rampa.mcp.server:main"

[project.entry-points."pytest11"]
rampa = "rampa.pytest_plugin"

[project.urls]
"Bug Tracker" = "https://github.com/tony/rampa/issues"
Repository = "https://github.com/tony/rampa"

[dependency-groups]
dev = [
  # Docs
  "gp-sphinx==0.1.0a38",
  "sphinx-autodoc-api-style==0.1.0a38",
  "sphinx-autodoc-fastmcp==0.1.0a38",
  "sphinx-autodoc-argparse==0.1.0a38",
  "sphinx-autodoc-pytest-fixtures==0.1.0a38",
  "sphinx-autobuild",
  "fastmcp>=4.0,<5.0",
  # Testing
  "pytest",
  "pytest-rerunfailures",
  "pytest-watcher",
  # Build (Rust extension)
  "maturin>=1.0,<2.0",
  # Scripts
  "tomlkit>=0.13",
  # Lint / typecheck (extras needed for ty resolution)
  "textual>=3.0",
  "grpcio>=1.70",
  "ruff>=0.16.1",
  "ty>=0.0.59",
]
docs = [
  "gp-sphinx==0.1.0a38",
  "sphinx-autodoc-api-style==0.1.0a38",
  "sphinx-autodoc-fastmcp==0.1.0a38",
  "sphinx-autodoc-argparse==0.1.0a38",
  "sphinx-autodoc-pytest-fixtures==0.1.0a38",
  "sphinx-autobuild",
  "fastmcp>=4.0,<5.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.uv]
cache-keys = [
  {file = "pyproject.toml"},
  {file = "rust/Cargo.toml"},
  {file = "rust/src/**/*.rs"},
]

[tool.uv.exclude-newer-package]
fastmcp = false
fastmcp-slim = false
gp-furo-theme = false
gp-libs = false
gp-sphinx = false
sphinx-autodoc-api-style = false
sphinx-autodoc-argparse = false
sphinx-autodoc-docutils = false
sphinx-autodoc-fastmcp = false
sphinx-autodoc-pytest-fixtures = false
sphinx-autodoc-sphinx = false
sphinx-autodoc-typehints-gp = false
sphinx-fonts = false
sphinx-gp-llms = false
sphinx-gp-opengraph = false
sphinx-gp-sitemap = false
sphinx-gp-theme = false
sphinx-ux-autodoc-layout = false
sphinx-ux-badges = false

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "rampa._core"
python-source = "src"
compatibility = "manylinux_2_34"
include = ["LICENSE"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = [
  "src",
  "tests",
]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "docs/conf.py",
  "tests/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "return NotImplemented",
  "def parse_args",
  "if TYPE_CHECKING:",
  "if t.TYPE_CHECKING:",
  "@overload( |$)",
  'class .*\bProtocol\):',
  "from __future__ import annotations",
  "import typing as t",
  "^\\s*\\.\\.\\.$",
  "^\\s*pass$",
  "^\\s*assert ",
  "^\\s*logger\\s*=",
  "^import ",
  "^from .* import",
  ": TypeAlias = ",
  "= t\\.TypeVar\\(",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# `select` is deliberately unset: ruff 0.16 enables a curated default rule
# set, and an explicit `select` would replace it rather than extend it.
# `extend-select` layers this project's additional linters on top.
extend-select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "COM", # flake8-commas
  "EM", # flake8-errmsg
  "Q", # flake8-quotes
  "PTH", # flake8-use-pathlib
  "SIM", # flake8-simplify
  "TRY", # Trycertatops
  "PERF", # Perflint
  "RUF", # Ruff-specific rules
  "D", # pydocstyle
  "FA100", # flake8-future-annotations
]
ignore = [
  "COM812", # missing trailing comma, ruff format conflict
]
extend-safe-fixes = [
  "UP006",
  "UP007",
]
pyupgrade.keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = [
  "rampa",
]
combine-as-imports = true
required-imports = [
  "from __future__ import annotations",
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = [
  "dataclasses",
  "random",
  "types",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
# Executing the Python blocks lifted out of docs/ is the whole point of this
# suite: a snippet that no longer runs against the current API is the failure
# it is looking for.
"tests/test_docs_examples.py" = ["S102"]
# `_drain_events` holds one buffered writer open for the life of the run, so
# the blocking cost is a single `open` plus a flush every few kilobytes.
# Handing each event write to a thread would put a hand-off in a path that
# runs for the whole test, and a load generator's own cost competes with what
# it measures.
"src/rampa/runner.py" = ["ASYNC230"]
# `run_iteration` is the boundary around the user's scenario function. A load
# test has to record the failed iteration and keep generating load whatever
# that function raises, so there is no narrower type to catch.
"src/rampa/executors/__init__.py" = ["BLE001"]
# `Worker.check` runs user-supplied predicates. A predicate that raises is a
# failed check, not a failed run, and user lambdas have no exception contract
# to narrow against.
"src/rampa/worker.py" = ["BLE001"]
# `Coordinator.broadcast` isolates each worker connection: one unreachable
# worker must not stop the message reaching the rest. The transport can fail
# in as many ways as the network and the remote peer allow.
"src/rampa/distributed/coordinator.py" = ["BLE001"]
# `cmd_use_local` rewrites config files belonging to other tools. Anything at
# all going wrong after the write has to restore the original bytes and report
# the backup path, so the rollback handler is deliberately total.
"scripts/mcp_swap.py" = ["BLE001"]

[tool.pytest.ini_options]
addopts = [
  "--tb=short",
  "--no-header",
  "--showlocals",
  "--doctest-modules",
]
doctest_optionflags = [
  "ELLIPSIS",
  "NORMALIZE_WHITESPACE",
]
filterwarnings = [
  # Add an ignore only with a comment naming the upstream cause.
  "error",
]
testpaths = [
  "src/rampa",
  "tests",
]
